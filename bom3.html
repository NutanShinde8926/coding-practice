<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout</title>
</head>
<body>
    <h2>setTimeout() method</h2>
    <p> A message will bi displayed below in 3 seconds</p>
    <h4 id="demo"></h4>
    <button onclick="myFun()">Display</button>
    <script>
        function myFun() {
            setTimeout(() => {
                document.getElementById('demo').innerHTML = 'Text  displayed';
            },3000);
        }
    </script>
</body>
</html>
