<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main, #main2, #demo, #main1 {
            height: 100px;
            width: 100px;
            background-color: rgba(144, 28, 28, 0.269);
            margin-bottom: 10px;
        }
        #btn {
            background-color: black;
            color: white;
            padding: 7px 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="main"></div>
    <div id="main2"></div>
    <div id="demo" tabindex="0"></div>
    <div id="main1" tabindex="0"></div>
    <button id="btn">click me</button>

    <script>
      
        let main = document.getElementById('main');
        main.addEventListener('click', () => {
            alert('main was clicked');
        });

        
        let main2 = document.getElementById('main2');
        main2.addEventListener('click', () => {
            alert('main2 was clicked');
        });

    
        let demo = document.getElementById('demo');
        demo.addEventListener('click', () => {
            alert('mouse over the element');
        });

        demo.addEventListener('dblclick', () => {
            alert('demo was clicked');
        });

     
        demo.addEventListener('keyup', () => {
            alert('popup key');
        });

      
        let btn = document.getElementById('btn');
        btn.addEventListener('mouseover', () => {
            btn.style.color = "black";
            btn.style.backgroundColor = "red";
            btn.style.borderRadius = '10px';
        });

        btn.addEventListener('mouseout', () => {
            btn.style.color = "white";
            btn.style.backgroundColor = "black";
            btn.style.borderRadius = '0';
        });

      
        let main1 = document.getElementById('main1');
        main1.addEventListener('keyup', () => {
            alert('key was up');
        });
    </script>
</body>
</html>
