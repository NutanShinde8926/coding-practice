<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <p id="para1">This is paragraph one.</p>
    <p id="para2">this is paragraph two.</p>
    <button onclick="change()">change</button>
    <script>
        function change(){
            document.getElementById("para1").style.color = "blue";
            document.getElementById("para1").style.backgroundColor = "yellow";

            document.getElementById("para2").style.color = "white";
            document.getElementById("para2").style.backgroundColor = "black";

     }
    </script>
</body>
</html>
