<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Interval</title>
</head>
<body>
     <h3>Click the button to start the counter</h3>
    <h4 id="demo"></h4>
    <button onclick="myfun()" >start</button>

    <h3>counter that stops</h3>
    <h4 id="demo1"></h4>
    <button onclick="startTimer()" >start</button>
    <button onclick="stopTimer()" >stop</button>

    <script>
         function myfun () {
             let ct = 1;
             setInterval(() => {
                 document.getElementById('demo').innerHTML = 'Count:' +ct;
                 ct++;
             },1000);
         }

        let t;

        function startTimer(){
            let count = 1;
            t = setInterval(() => {
                document.getElementById('demo1').innerHTML = 'count:' + count;
                count++;
            },1000);
        }
        function stopTimer(){
            clearInterval(t);
        }
        </script>
</body>
</html>
